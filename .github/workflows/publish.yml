name: Publish

on:
  workflow_dispatch:
  schedule:
    # schedule feuert nur auf dem Default-Branch (master).
    # Veröffentlicht wird trotzdem translation-de, der Publish-Branch.
    - cron: '17 10 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ref:
    name: Publish-Ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
    - name: Zu veröffentlichenden Commit bestimmen
      id: pick
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          sha=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/translation-de | cut -f1)
        else
          sha="${{ github.sha }}"
        fi
        if [ -z "$sha" ]; then
          echo "Kein Commit für den Publish gefunden." >&2
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Publish-Commit: $sha"

  package:
    name: Package (${{ matrix.target.name }})
    needs: ref
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: windows
            args: server --platform win-x64 --platform win-arm64
          - name: linux
            args: server --platform linux-x64 --platform linux-arm64
          - name: macos
            args: server --platform osx-x64 --platform osx-arm64
          - name: client
            args: client

    steps:
    - name: Fail if we are attempting to run on the master branch
      if: ${{GITHUB.REF_NAME == 'master' && github.repository == 'space-wizards/space-station-14'}}
      run: exit 1

    - uses: actions/checkout@v4.2.2
      with:
        ref: ${{ needs.ref.outputs.sha }}
        submodules: 'recursive'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.403

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package ${{ matrix.target.name }}
      run: dotnet run --project Content.Packaging ${{ matrix.target.args }}

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target.name }}
        path: release/*.zip
        compression-level: 0
        retention-days: 1
        if-no-files-found: error

  publish:
    needs: [ref, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      UPSTREAM_WEBHOOK: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_UPSTREAM }}

    steps:
    - uses: actions/checkout@v4.2.2
      with:
        ref: ${{ needs.ref.outputs.sha }}

    - name: Setup engine submodule
      run: git submodule update --init RobustToolbox

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-paramiko python3-lxml python3-requests python3-yaml

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        PUBLISH_VERSION: ${{ needs.ref.outputs.sha }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
        CHANGELOG_FILE: Resources/Changelog/ImmernachtChangelog.yml

    - name: Publish upstream changelog (Discord)
      if: env.UPSTREAM_WEBHOOK != ''
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK_UPSTREAM }}
        CHANGELOG_FILE: Resources/Changelog/GoobChangelog.yml

    - name: Mark changelog as published
      if: github.ref_name == 'master' || github.ref_name == 'translation-de'
      run: |
        git tag -f changelog-published
        git push -f origin refs/tags/changelog-published

