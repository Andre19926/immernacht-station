name: "Labels: Approved"

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  add_label:
    if: ${{ github.repository == 'Andre19926/immernacht-station' && github.event.review.state == 'APPROVED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Add Approved label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: "S: Approved"
