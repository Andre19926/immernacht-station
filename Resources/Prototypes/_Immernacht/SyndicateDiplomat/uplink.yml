# Eigener Uplink fuer den Syndikat-Diplomaten.
# - Eigene Waehrung ("Gefallen"), nicht mit Telekristallen kompatibel.
# - Eigene Kategorien, keine Waffen/Sprengstoffe/Implantate.
# - Startguthaben 30 Gefallen.

- type: currency
  id: DiplomaticFavor
  displayName: store-currency-display-diplomatic-favor
  canWithdraw: false

- type: storeCategory
  id: DiplomatLifestyle
  name: store-category-diplomat-lifestyle
  priority: 0

- type: storeCategory
  id: DiplomatGifts
  name: store-category-diplomat-gifts
  priority: 1

- type: storeCategory
  id: DiplomatOffice
  name: store-category-diplomat-office
  priority: 2

- type: storeCategory
  id: DiplomatSafety
  name: store-category-diplomat-safety
  priority: 3

- type: entity
  id: StorePresetDiplomat
  abstract: true
  components:
  - type: Store
    name: store-preset-name-diplomat
    categories:
    - DiplomatLifestyle
    - DiplomatGifts
    - DiplomatOffice
    - DiplomatSafety
    currencyWhitelist:
    - DiplomaticFavor
    balance:
      DiplomaticFavor: 30

- type: entity
  parent: [ BaseItem, StorePresetDiplomat ]
  id: SyndicateDiplomatUplink
  name: diplomatic courier
  description: A discreet courier terminal of the Syndicate diplomatic corps. Trades favors for lifestyle goods, gifts and office supplies.
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: radio
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  # Kein Schmuggelgut: der Gesandte traegt sein Terminal offen.

